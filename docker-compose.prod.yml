services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nfse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nfse
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  api: &api
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://nfse:${POSTGRES_PASSWORD}@db:5432/nfse
      FERNET_KEY: ${FERNET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HORAS: ${JWT_TTL_HORAS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      - db
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    <<: *api
    depends_on:
      - db
      - api
    command: >
      python -c "import asyncio; from app.db import SessionLocal; from app.worker import loop_worker; asyncio.run(loop_worker(SessionLocal))"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
